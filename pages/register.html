
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ثبت‌نام | کافه من
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >




</head>


<h1 id="darkModeBtn"></h1

<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        ☕ کافه من
    </h1>

    <a
        href="index.html"
        class="header-home"
    >
        بازگشت به خانه
    </a>

</header>



<!-- =========================
     REGISTER
========================= -->

<main class="user-register">

    <div class="register-box">


        <!-- آیکون -->

        <div class="register-icon">
            ☕
        </div>


        <!-- عنوان -->

        <h1>
            ساخت حساب کاربری
        </h1>


        <p class="register-subtitle">
            برای ثبت سفارش، یک حساب برای خودت بساز
        </p>



        <!-- فرم ثبت نام -->

        <form id="registerForm">


            <input
                type="text"
                id="registerUsername"
                placeholder="نام کاربری"
                required
            >


            <input
                type="email"
                id="registerEmail"
                placeholder="ایمیل"
                required
            >


            <input
                type="password"
                id="registerPassword"
                placeholder="رمز عبور"
                required
            >


            <input
                type="password"
                id="confirmPassword"
                placeholder="تکرار رمز عبور"
                required
            >


            <button type="submit">
                ثبت‌نام
            </button>


        </form>



        <!-- پیام -->

        <p id="registerMessage"></p>



        <!-- لینک ورود -->

        <p class="login-text">

            قبلاً حساب ساخته‌ای؟

            <a href="login.html">
                وارد شو
            </a>

        </p>



        <!-- بازگشت -->

        <a
            href="index.html"
            class="back-home"
        >
            ← بازگشت به خانه
        </a>


    </div>

</main>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/register.js"></script>

<script src="js/script.js"></script>


</body>

</html>
