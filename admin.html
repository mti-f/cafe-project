
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        پنل مدیریت | کافه من
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header>

    <h1>
        ☕ پنل مدیریت کافه
    </h1>

    <a href="index.html">
        بازگشت به سایت
    </a>

</header>


<main class="admin">

    <section class="stats">

        <div class="stat-card">

            <h3>
                تعداد سفارش‌ها
            </h3>

            <strong id="orderCount">
                0
            </strong>

        </div>

    </section>


    <section>

        <div class="admin-title">

            <h2>
                سفارش‌های مشتریان
            </h2>

            <button id="clearOrders">
                حذف همه سفارش‌ها
            </button>

        </div>


        <div id="ordersContainer">

        </div>

    </section>

</main>



<script>
    if (
        localStorage.getItem("adminLoggedIn")
        !== "true"
    ) {
        window.location.href =
            "admin-login.html";
    }
</script>


<script src="js/admin.js"></script>

</body>

</html>
